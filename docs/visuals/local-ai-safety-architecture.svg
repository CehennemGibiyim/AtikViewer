<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AtikViewer için önerilen yerel AI ve Human-in-the-Loop mimarisi</title>
  <desc id="desc">GitHub Pages yalnızca dokümantasyon ve sentetik demo sunar. Gerçek DICOM görüntüleri yerel AtikViewer, TypeScript API ve kurum içi AI modeli arasında kalır. Son kararı radyolog verir.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c2a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8d8"/>
      <stop offset="1" stop-color="#26e6bd"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#56d6cb"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#708399"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e7eef8}
      .muted{fill:#a6b5c9}.tiny{font-size:15px}.small{font-size:17px}.body{font-size:19px}.head{font-size:23px;font-weight:700}.title{font-size:30px;font-weight:800}
      .card{fill:#131f2d;stroke:#2a4054;stroke-width:2}.local{fill:#101d2a;stroke:#20c9bd;stroke-width:2.5}.safe{fill:#12271f;stroke:#32c887;stroke-width:2}.public{fill:#241c16;stroke:#d78c32;stroke-width:2}
      .line{fill:none;stroke:#56d6cb;stroke-width:4;marker-end:url(#arrow)}.dashed{fill:none;stroke:#73869a;stroke-width:3;stroke-dasharray:10 10;marker-end:url(#arrow-muted)}
      .badge{font-size:14px;font-weight:800;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="650" rx="22" fill="url(#bg)"/>
  <text x="54" y="60" class="title">AtikViewer · yerel AI ve insan denetimi</text>
  <text x="56" y="91" class="small muted">Önerilen mimari — bu şema canlı AI tanısı değil, güvenli geliştirme planıdır.</text>

  <!-- GitHub Pages boundary -->
  <rect x="54" y="126" width="1092" height="102" rx="16" class="public"/>
  <rect x="74" y="145" width="190" height="28" rx="14" fill="#5b391b"/>
  <text x="169" y="165" text-anchor="middle" class="badge" fill="#ffd39a">PUBLIC · GITHUB PAGES</text>
  <text x="292" y="164" class="head">Dokümantasyon + sentetik demo</text>
  <text x="292" y="196" class="body muted">Gerçek hasta görüntüsü, PACS adresi veya AI modeli burada bulunmaz.</text>
  <text x="1006" y="171" text-anchor="middle" class="head" fill="#ffbe69">PHI YOK</text>
  <text x="1006" y="198" text-anchor="middle" class="tiny muted">statik site</text>

  <!-- Local boundary -->
  <rect x="54" y="258" width="1092" height="327" rx="20" fill="#0e1a26" stroke="#238f93" stroke-width="2.5"/>
  <rect x="76" y="275" width="203" height="28" rx="14" fill="#124545"/>
  <text x="178" y="295" text-anchor="middle" class="badge" fill="#80f5dc">YEREL / ON-PREMISE</text>
  <text x="300" y="296" class="small muted">DICOM ve analiz verisi kurum sınırları içinde kalır.</text>

  <!-- Inputs -->
  <rect x="83" y="345" width="196" height="132" rx="14" class="card"/>
  <text x="181" y="382" text-anchor="middle" class="head">Görüntü</text>
  <text x="181" y="415" text-anchor="middle" class="body">Yerel DICOM</text>
  <text x="181" y="444" text-anchor="middle" class="small muted">veya izinli PACS</text>
  <text x="181" y="465" text-anchor="middle" class="tiny muted">kaynak değişmeden kalır</text>

  <!-- QA -->
  <rect x="328" y="345" width="213" height="132" rx="14" class="card"/>
  <text x="434" y="379" text-anchor="middle" class="head">Ön kontrol</text>
  <text x="434" y="411" text-anchor="middle" class="small">format · seri · geometri</text>
  <text x="434" y="439" text-anchor="middle" class="small">desteklenen veri mi?</text>
  <text x="434" y="465" text-anchor="middle" class="tiny" fill="#ffd16b">uygunsuzsa analiz durur</text>

  <!-- Viewer / API -->
  <rect x="590" y="345" width="228" height="132" rx="14" class="local"/>
  <text x="704" y="379" text-anchor="middle" class="head">AtikViewer</text>
  <text x="704" y="411" text-anchor="middle" class="small">mevcut arayüz korunur</text>
  <text x="704" y="439" text-anchor="middle" class="small">TypeScript özellik/API</text>
  <text x="704" y="465" text-anchor="middle" class="tiny muted">AI sonucu ayrı katmanda</text>

  <!-- AI model -->
  <rect x="867" y="345" width="235" height="132" rx="14" class="local"/>
  <text x="984" y="379" text-anchor="middle" class="head">Yerel AI modeli</text>
  <text x="984" y="411" text-anchor="middle" class="small">göreve özel · sürümlü</text>
  <text x="984" y="439" text-anchor="middle" class="small">ağ dışına veri göndermez</text>
  <text x="984" y="465" text-anchor="middle" class="tiny muted">öneri üretir, tanı koymaz</text>

  <path d="M279 411H318" class="line"/>
  <path d="M541 411H580" class="line"/>
  <path d="M818 411H857" class="line"/>
  <path d="M867 448C848 505 780 510 748 477" class="line"/>

  <!-- Human review -->
  <rect x="318" y="510" width="552" height="54" rx="14" class="safe"/>
  <text x="594" y="544" text-anchor="middle" class="head">Radyolog: kabul et · düzenle · reddet · ertele</text>
  <path d="M704 477V500" class="line"/>
  <text x="985" y="536" text-anchor="middle" class="small" fill="#8ef0bb">İnsan onayı zorunlu</text>
  <text x="985" y="559" text-anchor="middle" class="tiny muted">son karar ve imza doktorda</text>

  <!-- No data transfer arrow -->
  <path d="M1110 230V250" class="dashed"/>
  <text x="1088" y="246" text-anchor="end" class="tiny muted">hasta verisi aktarılmaz</text>
</svg>
