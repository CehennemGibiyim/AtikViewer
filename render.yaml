# Render.com tek tıkla dağıtım (Blueprint).
# Kullanım: GitHub reponuzu Render'a bağlayın, bu dosya otomatik algılanır.
# Ücretsiz planda ilk açılış yavaş olabilir; veritabanı ücretsiz planda 30 gün saklanır.

services:
  - type: web
    name: atikviewer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atikviewer-db
          property: connectionString
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: PACS_AUTH_HEADER
        sync: false
      - key: HIS_API_KEY
        sync: false
      - key: LLM_API_URL
        sync: false
      - key: LLM_API_KEY
        sync: false

databases:
  - name: atikviewer-db
    plan: free
    databaseName: app_db
    user: atikviewer
